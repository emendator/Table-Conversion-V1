# ============================================================
# 表格转换工具 - Nginx 站点配置
# 部署位置: /etc/nginx/sites-available/table-converter
#
# 说明：
#   1) 默认监听 80。若服务器在内地且未 ICP 备案、80 端口被运营商拦截，
#      可把 listen 80; 改成 listen 8080;，防火墙放行 8080，访问 http://IP:8080
#   2) 若已有已备案域名，可把 server_name _; 改成 server_name 你的域名;
#   3) 修改后执行: nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name _;

    # 上传/下载文件大小上限（含图片的 Excel 可能较大）
    # 注意：有客户上传约 107MB 的带图 Excel，100m 不够（会 413 返回 HTML 导致前端报错），故用 150m
    client_max_body_size 150m;

    # 前端静态文件（Vite 构建产物）
    root /opt/table-converter/frontend/dist;
    index index.html;

    # 前端页面与静态资源（SPA 兜底到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传大文件、转换耗时较长，放宽超时
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
